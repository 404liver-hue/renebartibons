<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pink Lily</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: #050308; color: #e9e2d0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Georgia, "Times New Roman", serif; }
  canvas { display: block; max-width: 100%; border-radius: 14px; }
  button { font: inherit; font-size: 1rem; color: #e9e2d0; background: transparent; border: 1px solid #6b665a; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e9e2d0; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="again" type="button">Bloom again</button>

<script>
const VW = 400, VH = 560;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let k = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth - 8, 520);
  cv.style.width = w + "px"; cv.style.height = w * VH / VW + "px";
  cv.width = w * dpr; cv.height = w * VH / VW * dpr;
  k = w / VW * dpr;
}
window.addEventListener("resize", resize);
resize();

const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const mix = (a, b, t) => a + (b - a) * t;
const rnd = a => { const x = Math.sin(a * 91.7) * 43758.5453; return x - Math.floor(x); };
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const lighten = (c, t) => c.map(v => mix(v, 255, t));

const BASE = { x: 200, y: VH + 6 };
const STEM = 2.8, BLOOM0 = 4.2, HOLD = 6, CAM = 0.65;
const ORD = [0, 2, 4, 1, 3, 5];
const total = BLOOM0 + 1 + 1.1 + 2.4 + 2.5 + HOLD;

const items = [
  { x: 200, y: 232, s: 1.15, c: [236, 82, 150],  r: 0.2, t: 0,     d: 0.0, bud: false },
  { x: 82,  y: 368, s: 0.85, c: [244, 112, 166], r: 0.9, t: -0.12, d: 0.5, bud: false },
  { x: 322, y: 346, s: 0.8,  c: [226, 70, 140],  r: 0.5, t: 0.14,  d: 1.0, bud: false },
  { x: 336, y: 190, s: 0.85, c: [240, 120, 170], r: 0,   t: 0.35,  d: 0,   bud: true },
  { x: 52,  y: 240, s: 0.75, c: [240, 120, 170], r: 0,   t: -0.4,  d: 0,   bud: true }
].map((f, i) => ({ ...f, i, cx: BASE.x + (f.x - BASE.x) * 0.1, cy: BASE.y - (BASE.y - f.y) * 0.55 }));

const flies = Array.from({ length: 30 }, (_, i) => ({ x: rnd(i + 200) * VW, y: rnd(i + 300) * VH, s: 6 + rnd(i + 400) * 10, p: rnd(i + 500) * 6 }));
const blades = Array.from({ length: 16 }, (_, i) => ({ x: 20 + rnd(i + 1) * 360, h: 22 + rnd(i + 2) * 34, l: (rnd(i + 3) - 0.5) * 30, p: rnd(i + 4) * 6 }));

function pt(f, t) {
  const u = 1 - t;
  return { x: u * u * BASE.x + 2 * u * t * f.cx + t * t * f.x, y: u * u * BASE.y + 2 * u * t * f.cy + t * t * f.y };
}

function drawStem(f, sp) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  [["#2f7d48", 4.5], ["#6cc27c", 1.4]].forEach(([c, w], i) => {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath();
    for (let j = 0; j <= 40; j++) { const p = pt(f, sp * j / 40); const x = p.x - (i ? 1 : 0); j ? ctx.lineTo(x, p.y) : ctx.moveTo(x, p.y); }
    ctx.stroke();
  });
  // lance-shaped leaves along the stem
  [0.16, 0.3, 0.44, 0.58].forEach((t, n) => {
    const lk = ease((sp - t) / 0.2);
    if (lk <= 0) return;
    const p = pt(f, t), dir = (n + f.i) % 2 ? 1 : -1, L = 54 * lk;
    const gr = ctx.createLinearGradient(p.x, p.y, p.x + dir * L, p.y - L * 0.55);
    gr.addColorStop(0, "#2f7d48"); gr.addColorStop(1, "#7fd08a");
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(p.x + dir * L * 0.6, p.y - L * 0.05, p.x + dir * L, p.y - L * 0.55);
    ctx.quadraticCurveTo(p.x + dir * L * 0.4, p.y - L * 0.38, p.x, p.y);
    ctx.fill();
  });
}

// One lily petal: wavy edge, curled tip, midrib, speckles
function petal(L, W, e, seed, col, side, bud) {
  const N = 20, curl = e * 0.9;
  const yy = u => -L * (u - 0.22 * curl * u * u * u);
  const sh = u => side * curl * L * 0.14 * u * u * u;
  const ww = u => W * Math.sin(Math.PI * Math.pow(u, 0.8)) * (1 + 0.07 * Math.sin(u * 16 + seed));
  ctx.beginPath(); ctx.moveTo(0, 0);
  for (let j = 1; j <= N; j++) { const u = j / N; ctx.lineTo(-ww(u) + sh(u), yy(u)); }
  for (let j = N - 1; j >= 0; j--) { const u = j / N; ctx.lineTo(ww(u) + sh(u), yy(u)); }
  ctx.closePath();
  const gr = ctx.createLinearGradient(0, 0, 0, -L);
  if (bud) {
    gr.addColorStop(0, "#78b064"); gr.addColorStop(0.4, "#c8c482"); gr.addColorStop(1, rgb(col));
  } else {
    gr.addColorStop(0, "#fff096"); gr.addColorStop(0.2, rgb(col));
    gr.addColorStop(0.7, rgb(lighten(col, 0.3))); gr.addColorStop(1, rgb(lighten(col, 0.7)));
  }
  ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 1; ctx.stroke();
  if (bud) return;
  ctx.strokeStyle = rgb(lighten(col, 0.6)); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(sh(0.1), yy(0.1));
  for (let j = 2; j <= 9; j++) { const u = j / 10; ctx.lineTo(sh(u), yy(u)); }
  ctx.stroke();
  if (e > 0.3) {
    ctx.fillStyle = "rgba(150,28,84,0.85)";
    for (let n = 0; n < 12; n++) {
      const u = 0.12 + 0.44 * rnd(seed * 7 + n), lat = (rnd(seed * 3 + n * 1.7) - 0.5) * 1.5 * ww(u);
      ctx.beginPath(); ctx.arc(lat + sh(u), yy(u), 2.1 * (0.6 + rnd(seed + n)), 0, 7); ctx.fill();
    }
  }
}

// 3D direction -> screen angle / length, viewed from slightly above
function proj(th, phi) {
  const x = Math.sin(phi) * Math.sin(th), yd = Math.sin(phi) * Math.cos(th), z = Math.cos(phi);
  const su = z * Math.cos(CAM) + yd * Math.sin(CAM);
  return { sx: x, su, len: Math.max(0.5, Math.hypot(x, su)), ang: Math.atan2(x, su), depth: yd };
}

function filament(th, phi, len, kind) {
  const p = proj(th, phi), x = p.sx * len, y = -p.su * len;
  ctx.strokeStyle = "#f0e8be"; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(x * 0.4, y * 0.7, x, y); ctx.stroke();
  ctx.save(); ctx.translate(x, y);
  if (kind === "anther") {
    ctx.fillStyle = "#96421f"; ctx.beginPath(); ctx.ellipse(0, 0, 9, 3.4, p.ang - Math.PI / 2, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = "#ff96b6"; ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawHead(f, T, hx, hy, S) {
  const start = BLOOM0 + f.d;
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(f.t); ctx.scale(S, S);
  const list = [];
  for (let j = 0; j < 6; j++) {
    const inner = j % 2, pe = ease((T - start - ORD.indexOf(j) * 0.22) / 2.4);
    const sway = Math.sin(T * 1.1 + j) * 0.03 * pe;
    const phi = mix(0.1, 1.1 + (inner ? 0 : 0.15) + 0.1 * Math.sin(j * 2.3), pe) + sway;
    list.push({ j, inner, pe, p: proj(j * Math.PI / 3 + f.r, phi) });
  }
  list.sort((a, b) => (b.p.depth - (b.inner ? 0.25 : 0)) - (a.p.depth - (a.inner ? 0.25 : 0)));
  list.forEach(it => {
    ctx.save(); ctx.rotate(it.p.ang); ctx.scale(1, it.p.len);
    petal(84 * f.s * mix(0.7, 1, it.pe), (it.inner ? 33 : 25) * f.s * mix(0.5, 1, it.pe),
          it.pe, it.j * 3.1 + f.i, f.c, it.j % 4 < 2 ? 1 : -1, false);
    ctx.restore();
  });
  const se = ease((T - start - 1.0) / 2.5);
  if (se > 0) {
    for (let j = 0; j < 6; j++) filament(j * Math.PI / 3 + 0.5 + f.r, 0.45 + 0.1 * Math.sin(j * 1.7), 60 * f.s * se, "anther");
    filament(f.r + 3.3, 0.3, 76 * f.s * se, "pistil");
  }
  ctx.restore();
}

function drawBud(f, T, hx, hy, S) {
  const g = ease((T - BLOOM0 + 0.5) / 3);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(f.t); ctx.scale(S, S);
  [-0.12, 0.12].forEach((a, i) => { ctx.save(); ctx.rotate(a); petal(60 * f.s * (0.5 + 0.5 * g), 18 * f.s, 0, i + f.i, f.c, 1, true); ctx.restore(); });
  ctx.restore();
}

function render(T) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, "#060309"); bg.addColorStop(0.7, "#120a18"); bg.addColorStop(1, "#0a1a10");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

  const bloomed = ease((T - BLOOM0) / 4);
  const glow = ctx.createRadialGradient(200, 250, 10, 200, 250, 300);
  glow.addColorStop(0, `rgba(255,110,170,${0.3 * bloomed * (0.85 + 0.15 * Math.sin(T * 1.4))})`);
  glow.addColorStop(1, "rgba(255,110,170,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, VW, VH);

  // grass at the base
  const gt = ease(T / 1.5);
  ctx.strokeStyle = "#2f7d48"; ctx.lineWidth = 2; ctx.lineCap = "round";
  blades.forEach(b => {
    const h = b.h * gt, sw = Math.sin(T * 1.3 + b.p) * 4;
    ctx.beginPath(); ctx.moveTo(b.x, VH); ctx.quadraticCurveTo(b.x + b.l * 0.4, VH - h * 0.6, b.x + b.l + sw, VH - h); ctx.stroke();
  });

  items.forEach(f => {
    const sp = ease((T - f.i * 0.3) / STEM);
    if (sp <= 0) return;
    drawStem(f, sp);
    const tip = pt(f, Math.max(sp, 0.001));
    const S = 0.55 + 0.45 * ease((T - 3.2) / 3);
    const bob = bloomed * Math.sin(T * 1.1 + f.i) * 2;
    f.bud ? drawBud(f, T, tip.x, tip.y + bob, S) : drawHead(f, T, tip.x, tip.y + bob, S);
  });

  // drifting pink sparks after the bloom
  const fl = ease((T - 5.5) / 2);
  if (fl > 0) flies.forEach(p => {
    const y = ((p.y - T * p.s) % VH + VH) % VH, x = p.x + Math.sin(T * 0.7 + p.p) * 14;
    const a = fl * 0.7 * (0.5 + 0.5 * Math.sin(T * 2 + p.p));
    const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
    g.addColorStop(0, `rgba(255,205,225,${a})`); g.addColorStop(1, "rgba(255,205,225,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 6, y - 6, 12, 12);
  });
}

let start = performance.now();
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  let T = (now - start) / 1000;
  if (reduce) T = total;
  else if (T > total) { start = now; T = 0; }
  render(T);
  requestAnimationFrame(frame);
}
document.getElementById("again").addEventListener("click", () => { start = performance.now(); });
cv.addEventListener("click", () => { start = performance.now(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
